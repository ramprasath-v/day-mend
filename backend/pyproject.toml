[project]
name = "daymend-backend"
version = "0.1.0"
description = "Backend foundation for the DayMend childcare disruption recovery agent."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "boto3>=1.40,<2",
    "pydantic>=2.10,<3",
    "strands-agents>=1.53,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
