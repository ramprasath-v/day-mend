@if (!recovery() || canDecline()) {
<aside class="demo" aria-label="Demo scenario controls">
  <div><span>Demo scenario</span><small>Choose the next real-world change</small></div>
  <div class="demo__actions">
    @if (!recovery()) {
      <button
        type="button"
        class="button button--primary"
        [disabled]="busy()"
        (click)="start.emit()"
      >
        Nanny unavailable
      </button>
    } @else {
      @if (canDecline()) {
        <button
          type="button"
          class="button button--secondary"
          [disabled]="busy()"
          (click)="decline.emit()"
        >
          Grandma can’t help
        </button>
      }
    }
  </div>
</aside>
}
