<aside class="demo" aria-label="Demo controls">
  <div><span>Demo controls</span><small>Triggers real backend workflow events</small></div>
  <div class="demo__actions">
    @if (!recovery()) {
      <button
        type="button"
        class="button button--primary"
        [disabled]="busy()"
        (click)="start.emit()"
      >
        Simulate nanny cancellation
      </button>
    } @else {
      @if (canDecline()) {
        <button
          type="button"
          class="button button--secondary"
          [disabled]="busy()"
          (click)="decline.emit()"
        >
          Simulate Grandma decline
        </button>
      }
      <button
        type="button"
        class="button button--icon"
        aria-label="Refresh recovery"
        [disabled]="busy()"
        (click)="refresh.emit()"
      >
        ↻
      </button>
    }
  </div>
</aside>
